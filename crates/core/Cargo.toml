[package]
name = "ugly-core"
version = "1.0.0"
description = "Shared data layer for UGLy: library storage, models and installed-game detection"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
log = "0.4"

# Locating the Steam install (HKCU\Software\Valve\Steam\SteamPath).
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempdir = "0.3"
