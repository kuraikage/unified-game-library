[workspace]
resolver = "2"
members = ["src-tauri", "crates/core", "crates/mcp"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.77.2"

[workspace.dependencies]
ugly-core = { path = "crates/core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1"
log = "0.4"
