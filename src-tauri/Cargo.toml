[package]
name = "ugly"
version = "1.0.0"
description = "Unified Game Library - all your games, one place"
authors = ["UGLy"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# Data layer shared with the MCP server.
ugly-core = { workspace = true }

serde_json = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"

# HTTP client for Steam / IGDB / Twitch. rustls avoids depending on the system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }

# Credentials live in the Windows Credential Manager, never in the webview.
keyring = { version = "3", features = ["windows-native"] }

# Small local HTTP listener that receives the Epic bookmarklet POST.
axum = { version = "0.7", features = ["form"] }
tower-http = { version = "0.6", features = ["cors"] }

thiserror = "2"
urlencoding = "2"

# Opening protocol URLs without going through cmd.exe, and detecting a running launcher.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Diagnostics_ToolHelp",
] }
winreg = "0.52"
